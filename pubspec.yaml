name: tecnoflow3
description: Control de stock de repuestos para taller de mantenimiento
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  go_router: ^13.2.0
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  pdf: ^3.10.8
  printing: ^5.12.0
  image_picker: ^1.2.2
  share_plus: ^10.0.0       # share sheet nativo
  path_provider: ^2.1.0     # directorio temporal del dispositivo
  package_info_plus: ^8.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
